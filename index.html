/* Height comes from the board's row count, because iOS WebKit stretches a button sized with aspect-ratio. */

  margin: 0; padding: 0; border: 0; border-radius: 50%; background: none; -webkit-appearance: none; appearance: none;

<body>
<main class="page">
  <header class="intro">
    <h1>國王的百枚硬幣</h1>
    <p class="lead">國王把 100 枚硬幣撒在桌上，其中 10 枚正面朝上、90 枚反面朝上。你被蒙上雙眼，摸不出硬幣的正反。</p>
    <p class="quote">「把硬幣分成兩堆，保證兩堆正面朝上的數量完全一樣，我就放你走。」</p>
    <p class="prompt">你會怎麼分？先自己想想，再到下面動手試。</p>
  </header>

  <section class="sim" aria-label="硬幣模擬">
    <div class="board" id="board">
      <span class="pile-label" id="labelA" hidden></span>
      <span class="pile-label" id="labelB" hidden></span>
    </div>

    <div class="panel">
      <div class="panel" id="pIntro">
        <h2 id="introTitle"></h2>
        <p id="introText" aria-live="polite"></p>
        <div class="btns"><button class="btn ghost" id="skip" type="button">略過動畫</button></div>
      </div>

      <div class="panel" id="pChoose" hidden>
        <h2>第一堆要挑幾枚？</h2>
        <p class="muted">你看不到正反。直接點硬幣自己挑，或拉桿子、交給電腦分。</p>
        <p class="count" aria-live="polite">第一堆 <b id="nA">0</b> 枚　第二堆 <b id="nB">100</b> 枚</p>
        <input type="range" id="slider" min="0" max="100" value="0" aria-label="第一堆的硬幣數量">
        <div class="btns">
          <button class="btn ghost" id="p50" type="button">50 / 50</button>
          <button class="btn ghost" id="p40" type="button">40 / 60</button>
          <button class="btn ghost" id="pRand" type="button">電腦隨機分</button>
          <button class="btn ghost" id="pClear" type="button">清空</button>
        </div>
        <div class="btns"><button class="btn" id="split" type="button">分成這兩堆</button></div>
      </div>

      <div class="panel" id="pAct" hidden>
        <h2>分好了，接下來呢？</h2>
        <p class="muted">你還是看不到正反，不過可以把硬幣翻面。點一枚就翻一枚，也可以整堆一起翻。想好就揭曉。</p>
        <p class="count" id="flipCount" aria-live="polite"></p>
        <div class="btns">
          <button class="btn ghost" id="flipA" type="button">翻第一堆全部</button>
          <button class="btn ghost" id="flipB" type="button">翻第二堆全部</button>
        </div>
        <div class="btns">
          <button class="btn" id="reveal" type="button">揭曉結果</button>
          <button class="btn ghost" id="resplit" type="button">重新分堆</button>
        </div>
      </div>

      <div class="panel" id="pResult" hidden>
        <h2 id="resultTitle" aria-live="polite"></h2>
        <div class="score">
          <div><small>第一堆的正面</small><strong id="sA"></strong></div>
          <div class="sign" id="sign"></div>
          <div><small>第二堆的正面</small><strong id="sB"></strong></div>
        </div>
        <p id="resultText"></p>
        <p class="test" id="testText" aria-live="polite" hidden></p>
        <div class="btns">
          <button class="btn" id="test" type="button">同一個做法連試 100 次</button>
          <button class="btn ghost" id="again" type="button">重新洗牌再試</button>
        </div>
      </div>
    </div>
  </section>
</main>

<script>
(function () {
  var TOTAL = 100, HEADS = 10;
  var reduced = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
  var $ = function (id) { return document.getElementById(id); };
  var board = $('board');
  var coins = [], order = [], selected = new Set(), stage = 'intro', runId = 0;

  function shuffle(a) {
    for (var j = a.length - 1; j > 0; j--) {
      var r = Math.floor(Math.random() * (j + 1)), t = a[j];
      a[j] = a[r]; a[r] = t;
    }
    return a;
  }
  function sleep(ms) { return new Promise(function (r) { setTimeout(r, ms); }); }

  /* ---------- Coins ---------- */
  for (var i = 0; i < TOTAL; i++) {
    var el = document.createElement('button');
    el.type = 'button'; el.className = 'coin'; el.dataset.i = i;
    var face = document.createElement('span');
    el.appendChild(face);
    board.appendChild(el);
    coins.push({ el: el, face: face, head: i < HEADS, flipped: false });
    order.push(i);
  }
  function isHead(c) { return c.head !== c.flipped; }
  function paint(c, hidden) {
    if (hidden) {
      c.face.className = 'face b';
      c.face.textContent = c.flipped ? '翻' : '';
      c.el.setAttribute('aria-label', c.flipped ? '翻過的硬幣，看不到正反' : '硬幣，看不到正反');
    } else {
      var up = isHead(c);
      c.face.className = 'face ' + (up ? 'h' : 't');
      c.face.textContent = up ? '正' : '反';
      c.el.setAttribute('aria-label', up ? '正面硬幣' : '反面硬幣');
    }
  }
  // Spins the coin and swaps its face at the halfway point.
  function spin(c, hidden, delay) {
    if (reduced) { paint(c, hidden); return; }
    c.face.animate([{ transform: 'rotateY(0deg)' }, { transform: 'rotateY(90deg)' }, { transform: 'rotateY(0deg)' }],
      { duration: 320, delay: delay || 0, easing: 'ease-in-out' });
    setTimeout(function () { paint(c, hidden); }, (delay || 0) + 160);
  }
  function place(c, x, y, rot) {
    c.el.style.transform = 'translate(' + (x * 100) + '%,' + (y * 100) + '%)' + (rot ? ' rotate(' + rot + 'deg)' : '');
  }
  function setUnits(units) { board.style.setProperty('--units', units); }
  function layoutGrid() {
    setUnits(10);
    $('labelA').hidden = $('labelB').hidden = true;
    order.forEach(function (id, slot) { place(coins[id], slot % 10, Math.floor(slot / 10)); });
  }
  function layoutPiles() {
    var a = order.filter(function (id) { return selected.has(id); });
    var b = order.filter(function (id) { return !selected.has(id); });
    var LABEL = 0.7, GAP = 0.3, y = LABEL;
    var rowsA = Math.ceil(a.length / 10), rowsB = Math.ceil(b.length / 10);
    var yB = LABEL + rowsA + GAP + LABEL, units = yB + rowsB;
    setUnits(units);
    a.forEach(function (id, n) { place(coins[id], n % 10, y + Math.floor(n / 10)); });
    b.forEach(function (id, n) { place(coins[id], n % 10, yB + Math.floor(n / 10)); });
    $('labelA').textContent = '第一堆（' + a.length + ' 枚）';
    $('labelB').textContent = '第二堆（' + b.length + ' 枚）';
    $('labelA').style.top = (0.2 / units * 100) + '%';
    $('labelB').style.top = ((yB - LABEL + 0.2) / units * 100) + '%';
    $('labelA').hidden = $('labelB').hidden = false;
  }

  /* ---------- Stages ---------- */
  function setStage(s) {
    stage = s;
    $('pIntro').hidden = s !== 'intro';
    $('pChoose').hidden = s !== 'choose';
    $('pAct').hidden = s !== 'act';
    $('pResult').hidden = s !== 'result';
    var live = s === 'choose' || s === 'act';
    board.classList.toggle('live', live);
    coins.forEach(function (c) { c.el.disabled = !live; });
  }
  function caption(title, text) { $('introTitle').textContent = title; $('introText').textContent = text; }

  function startChoosing() {
    order.forEach(function (id) { paint(coins[id], true); });
    layoutGrid();
    setStage('choose');
    syncCount();
  }

  function resetCoins() {
    selected.clear();
    coins.forEach(function (c) { c.flipped = false; c.el.classList.remove('sel'); });
    shuffle(order);
    $('next').classList.remove('solved');
    $('testText').hidden = true;
  }

  function scatter() {
    coins.forEach(function (c) {
      place(c, Math.random() * 9, Math.random() * 9, Math.random() * 360 - 180);
    });
  }

  async function intro(firstTime) {
    var id = ++runId;
    var alive = function () { return id === runId; };
    setStage('intro');
    $('labelA').hidden = $('labelB').hidden = true;
    setUnits(10);
    resetCoins();
    if (reduced) { startChoosing(); return; }

    if (firstTime) {
      // Show the real coins in plain order before anything is hidden.
      coins.forEach(function (c, n) { paint(c, false); place(c, n % 10, Math.floor(n / 10)); });
      caption('這是國王的 100 枚硬幣', '10 枚正面、90 枚反面。記好了，等一下你就看不到了。');
      await sleep(2200); if (!alive()) return;
    }
    caption('蒙上眼睛', '現在每一枚看起來都一樣，你分不出正反。');
    coins.forEach(function (c) { spin(c, true, Math.random() * 500); });
    await sleep(firstTime ? 1500 : 800); if (!alive()) return;

    caption('洗牌', '硬幣全部打亂。');
    for (var r = 0; r < 3; r++) {
      scatter();
      await sleep(460); if (!alive()) return;
    }
    layoutGrid();
    await sleep(520); if (!alive()) return;
    startChoosing();
  }
  $('skip').addEventListener('click', function () { runId++; startChoosing(); });

  /* ---------- Choosing piles ---------- */
  function syncCount() {
    var n = selected.size;
    $('nA').textContent = n;
    $('nB').textContent = TOTAL - n;
    $('slider').value = n;
    $('split').disabled = n === 0 || n === TOTAL;
    coins.forEach(function (c, id) { c.el.classList.toggle('sel', selected.has(id)); });
  }
  // Grows or shrinks the first pile with random coins, keeping any picked by hand.
  function adjustTo(n) {
    var inPile = shuffle(Array.from(selected));
    var outPile = shuffle(order.filter(function (id) { return !selected.has(id); }));
    while (selected.size > n) selected.delete(inPile.pop());
    while (selected.size < n) selected.add(outPile.pop());
    syncCount();
  }
  function fresh(n) { selected.clear(); adjustTo(n); }
  $('slider').addEventListener('input', function (e) { adjustTo(Number(e.target.value)); });
  $('p50').addEventListener('click', function () { fresh(50); });
  $('p40').addEventListener('click', function () { fresh(40); });
  $('pRand').addEventListener('click', function () { fresh(20 + Math.floor(Math.random() * 61)); });
  $('pClear').addEventListener('click', function () { fresh(0); });
  $('split').addEventListener('click', function () {
    coins.forEach(function (c) { c.el.classList.remove('sel'); });
    layoutPiles();
    setStage('act');
    syncFlips();
  });

  /* ---------- Flipping ---------- */
  function flipCounts() {
    var a = 0, b = 0;
    coins.forEach(function (c, id) { if (c.flipped) { if (selected.has(id)) a++; else b++; } });
    return { a: a, b: b };
  }
  function syncFlips() {
    var f = flipCounts();
    $('flipCount').textContent = '已翻：第一堆 ' + f.a + ' / ' + selected.size + ' 枚，第二堆 ' + f.b + ' / ' + (TOTAL - selected.size) + ' 枚';
  }
  function flipPile(inFirst) {
    var n = 0;
    order.forEach(function (id) {
      if (selected.has(id) !== inFirst) return;
      var c = coins[id];
      c.flipped = !c.flipped;
      spin(c, true, Math.min(n++ * 12, 400));
    });
    syncFlips();
  }
  $('flipA').addEventListener('click', function () { flipPile(true); });
  $('flipB').addEventListener('click', function () { flipPile(false); });
  $('resplit').addEventListener('click', function () {
    coins.forEach(function (c) { c.flipped = false; });
    startChoosing();
  });

  board.addEventListener('click', function (e) {
    var el = e.target.closest('.coin');
    if (!el || el.disabled) return;
    var id = Number(el.dataset.i), c = coins[id];
    if (stage === 'choose') {
      if (selected.has(id)) selected.delete(id); else selected.add(id);
      syncCount();
    } else if (stage === 'act') {
      c.flipped = !c.flipped;
      spin(c, true);
      syncFlips();
    }
  });

  /* ---------- Result ---------- */
  function countHeads() {
    var a = 0, b = 0;
    coins.forEach(function (c, id) { if (isHead(c)) { if (selected.has(id)) a++; else b++; } });
    return { a: a, b: b };
  }
  $('reveal').addEventListener('click', function () {
    var n = 0, h = countHeads(), even = h.a === h.b;
    order.forEach(function (id) { spin(coins[id], false, Math.min(n++ * 8, 600)); });
    setStage('result');
    $('sA').textContent = h.a;
    $('sB').textContent = h.b;
    $('sign').textContent = even ? '=' : '≠';
    $('sign').className = 'sign ' + (even ? 'even' : 'odd');
    $('resultTitle').textContent = even ? '這次一樣多！' : '這次不一樣多';
    $('resultText').textContent = even
      ? '不過國王要的是保證。同一個做法多試幾次，看看是不是每次都成立。'
      : '差了 ' + Math.abs(h.a - h.b) + ' 枚。想想看要怎麼改，或連試 100 次，看這個做法的成功率。';
    $('testText').hidden = true;
  });

  // Replays the same blind strategy: pile size and how many coins were flipped in each pile.
  function testStrategy() {
    var nA = selected.size, f = flipCounts(), wins = 0;
    for (var t = 0; t < 100; t++) {
      var deck = [];
      for (var i = 0; i < TOTAL; i++) deck.push(i < HEADS);
      shuffle(deck);
      var a = 0, b = 0;
      deck.forEach(function (head, i) {
        var inA = i < nA;
        var flip = inA ? i < f.a : i < nA + f.b;
        if (head !== flip) { if (inA) a++; else b++; }
      });
      if (a === b) wins++;
    }
    return wins;
  }
  $('test').addEventListener('click', function () {
    var wins = testStrategy(), f = flipCounts(), box = $('testText');
    var how = '第一堆 ' + selected.size + ' 枚翻 ' + f.a + ' 枚，第二堆 ' + (TOTAL - selected.size) + ' 枚翻 ' + f.b + ' 枚';
    box.hidden = false;
    if (wins === 100) {
      box.textContent = how + '：100 次全部一樣多！你解開了。到右下角看答案，對照為什麼一定成立。';
      $('next').classList.add('solved');
    } else {
      box.textContent = how + '：100 次裡只有 ' + wins + ' 次一樣多。這樣還不算保證，再想想。';
    }
  });
  $('again').addEventListener('click', function () { intro(false); });

  intro(true);
})();
</script>
</body>
</html>
